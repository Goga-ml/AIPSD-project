# Golden set v1 · Groundwork · Ask Across Interviews (retrieval path) · Week 4
# Corpus: data/transcripts/interview_01..03.txt, facts from data/transcripts/answer_key.json.
# Composition for Week 4: 2 factual, 1 reasoning, 1 edge case, 1 refusal.
# Week 11 grows this to 10: 3 factual, 2 reasoning, 2 edge, 2 refusal, 1 format.
#
# expect        answered | refused
# must_cite     interview_NN:LNN citations that MUST be in the answer's citations
# must_mention  short, exact phrases that MUST appear in the answer (case-insensitive)
# why           one line: what this question protects
#
# Rules: never weaken or delete a question to make a run pass. Fix the pipeline, or
# write down why the question was wrong in a decision record.
# Run: python hw1/Goga-ml/src/ask.py "<question>"   (min_score 0.65, k 5)

threshold: 0.70

items:
  - id: g1
    type: factual
    question: "What do people currently pay?"
    expect: answered
    must_cite: [interview_01:L11, interview_02:L13, interview_03:L11]
    must_mention: ["45 GEL", "200 GEL"]
    must_not_mention: ["20 GEL"]
    why: "Current spending is the strongest evidence; the 'would pay maybe 20 GEL' hypothetical must not be reported as spending."

  - id: g2
    type: factual
    question: "What happens when they run out of stock?"
    expect: answered
    must_cite: [interview_01:L5, interview_02:L17]
    must_mention: ["oat milk", "butter"]
    why: "Pains must come with the line they were said on, or the founder cannot check them."

  - id: g3
    type: reasoning
    question: "Who agreed to try the product, and what problem do they have today?"
    expect: answered
    must_cite: [interview_02:L19, interview_02:L7]
    must_mention: ["two weeks"]
    why: "A commitment only means something next to the pain behind it; needs two turns together."

  - id: g4
    type: edge
    question: "how much do ppl pay rn for stock stuff"
    expect: answered
    must_cite: [interview_01:L11]
    must_mention: ["45 GEL"]
    why: "Founders type in shorthand; a lowercase, slangy question must not fall under min_score."

  - id: g5
    type: refusal
    question: "What is the weather like in Batumi in winter?"
    expect: refused
    must_cite: []
    must_mention: []
    why: "An unrelated question must return 'no evidence found' with zero chat-model calls, not a confident guess."
